name: AI Operations CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      #MLFLOW_TRACKING_URI: sqlite:///mlflow-ci.db
      MLFLOW_TRACKING_URI: file:./mlruns
      MLFLOW_ALLOW_FILE_STORE: "true"

    defaults:
      run:
        working-directory: applications/ai-operations-assistant

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest -q

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: applications/ai-operations-assistant

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t ai-operations-assistant:ci \
            .

      - name: Verify Docker image
        run: |
          docker image inspect ai-operations-assistant:ci
        
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ai-operations-assistant:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"